name: Link Check

# Verifies that all links in the repo work.
# Runs on every pull request, every push to main, and weekly (to catch
# links that break over time on the destination sites).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"   # every Monday at 08:00 UTC
  workflow_dispatch:        # allow manual runs from the Actions tab

permissions:
  contents: read
  issues: write             # lets the scheduled run open an issue if links break

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --accept 200,206,301,302,307,308,429
            --exclude-mail
            './**/*.md'
          fail: ${{ github.event_name == 'pull_request' }}
          # PRs fail on broken links; scheduled/main runs report instead of failing

      - name: Open issue on broken links (scheduled runs only)
        if: ${{ failure() && github.event_name == 'schedule' }}
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🔗 Broken links detected"
          content-filepath: ./lychee/out.md
          labels: bug, links
